# ---------------- multi-hop (SPM + internal) ----------------
- id: g023
  question: "Does Example Bank's post-incident review timeline address the TM-G-1 expectation on incident management?"
  category: multi-hop
  expectedSources: [{docId: spm-tm-g-1, section: "5.1.3"}, {docId: eb-incident-mgmt-standard, section: "6"}]
  expectedPoints: ["TM-G-1 expects a problem management system to escalate, record, analyse and track incidents until rectification", "Example Bank reviews S1/S2 incidents within 10 business days with root cause and tracked actions"]
  minClearance: internal
  split: dev
- id: g024
  question: "How does Example Bank's change freeze policy relate to TM-G-1's guidance on change management?"
  category: multi-hop
  expectedSources: [{docId: spm-tm-g-1, section: "4.3"}, {docId: eb-change-mgmt-policy, section: "5"}]
  expectedPoints: ["TM-G-1 expects changes to production to be planned, reviewed and approved", "TM-G-1 does not prescribe freeze periods; Example Bank adds them at quarter end, 15 Dec to 2 Jan and around Lunar New Year"]
  minClearance: internal
  split: test
- id: g025
  question: "Does the PayHub BCP testing frequency meet TM-G-2's expectations on testing?"
  category: multi-hop
  expectedSources: [{docId: spm-tm-g-2, section: "6.1"}, {docId: eb-payments-bcp-runbook, section: "5"}]
  expectedPoints: ["TM-G-2 leaves the testing frequency to the AI, based on impact, number of critical operations and changes in the environment", "TM-G-2 expects senior management to participate in testing", "PayHub runs a full failover every six months and a quarterly walkthrough"]
  minClearance: internal
  split: dev
- id: g026
  question: "Is Example Bank's segregation of duties for production deployment consistent with TM-G-1?"
  category: multi-hop
  expectedSources: [{docId: spm-tm-g-1, section: "4.3.1"}, {docId: spm-tm-g-1, section: "2.2.2"}, {docId: eb-change-mgmt-policy, section: "4"}]
  expectedPoints: ["TM-G-1 expects changes not to reach production without review and approval by other authorised personnel, with adequate segregation of duties", "developers may not deploy their own changes"]
  minClearance: internal
  split: dev
- id: g027
  question: "How does Example Bank's privileged access review compare with TM-G-1's guidance on access control?"
  category: multi-hop
  expectedSources: [{docId: spm-tm-g-1, section: "3.2"}, {docId: eb-access-mgmt-standard, section: "3"}]
  expectedPoints: ["TM-G-1 expects extra care over privileged and emergency IDs, including monitoring their activities", "Example Bank reviews privileged accounts quarterly and records sessions"]
  minClearance: internal
  split: test
- id: g028
  question: "If a system fault makes a corporate payment miss its cut-off, which procedures apply and how quickly must the CIO hear about it if it is S1?"
  category: multi-hop
  expectedSources: [{docId: eb-settlement-exception-sop, section: "3"}, {docId: eb-incident-mgmt-standard, section: "4"}]
  expectedPoints: ["logged under the Technology Incident Management Standard", "CIO notified within 30 minutes of S1 declaration"]
  minClearance: internal
  split: dev
- id: g029
  question: "Are emergency changes allowed during a change freeze, and who must approve them?"
  category: multi-hop
  expectedSources: [{docId: eb-change-mgmt-policy, section: "2"}, {docId: eb-change-mgmt-policy, section: "5"}]
  expectedPoints: ["yes, emergency changes are permitted", "Head of Technology Operations plus additional CIO approval during a freeze"]
  minClearance: internal
  split: dev


# Golden set. Drafted with AI assistance; every question, source and expected point was
# reviewed and approved by the author on 2026-11-08 (ROADMAP §10).
#
# Schema: ROADMAP §5 Phase 0, plus `split` (spec 00 §11 Q1).
# Markdown `section` values are heading numbers (`## 2 ...` -> "2"), since the Markdown
# sectionPath is the heading chain (ROADMAP §4.1). Numbered paragraphs inside a heading
# (e.g. 2.2) are not sections and are not used here.
# SPM sections were checked against the PDFs listed in corpus/manifest.yaml. Expected points
# paraphrase the SPM; they never quote it (no SPM text in git).
# Note: the SPM says "tolerance for disruption" (never "impact tolerance") and has no "RTO".
#
# Distribution: factual 14, exact-term 8, multi-hop 7, restricted 7, unanswerable 6 = 42
# Split: dev 30, test 12 (stratified by category)


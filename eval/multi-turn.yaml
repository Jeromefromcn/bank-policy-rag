# Multi-turn eval set (docs/specs/04-rerank-rewrite.md §7.2). Drafted by Claude from golden-set pairs; approved by the
# author on 2026-11-10.
#
# Each item is a two-turn conversation. Turn 1 asks an existing golden item's question live (`turns`); the follow-up
# only makes sense with that context. `standaloneGoldenId` is the golden item whose question is the self-contained
# form of the follow-up; its expectedSources score the follow-up retrieval (raw / rewrite / standalone).
# `split` follows the standalone item, so no test item is tuned on. `minClearance` is the highest clearance any turn
# needs; the whole conversation runs with that caller's key.
#
# Distribution: 8 dev, 4 test.

- id: m01
  split: dev
  turns: [g001]
  followUp: "How soon must the CIO be told about the most severe one?"
  standaloneGoldenId: g002
  minClearance: internal

# Local Elasticsearch and Ollama for running this project on your own machine (ROADMAP §7).
#
# The author's development server does not start this file: it uses shared Elasticsearch
# and Ollama stacks instead (decisions/01, Decision 5). Images, digests and limits here match
# those stacks, so results are comparable.
#
# Every service must have CPU and memory limits; scripts/check-compose-limits.sh enforces it.
services:
  elasticsearch:
    # 9.5.5
    image: elasticsearch:9.5.5@sha256:a418cab5c89773ab827d1d146e6c95a3658226216d8d934d404c33e7a09a147d
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      # Plain HTTP: the port binds loopback only.
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ELASTIC_PASSWORD: "${ES_PASSWORD:?set ES_PASSWORD in .env}"
      # Heap is half the container memory; the rest is left for the Lucene page cache.
      ES_JAVA_OPTS: "-Xms1536m -Xmx1536m"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"

  ollama:
    # 0.40.15
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 2.5G
    volumes:
      - ollama-models:/root/.ollama
    ports:
      # Ollama has no authentication: loopback only.
      - "127.0.0.1:11434:11434"

  reranker:
    # Cross-encoder sidecar built from ./reranker (docs/specs/04-rerank-rewrite.md §3). Profile `rerank`: Phase 4.
    # Default model: cross-encoder/ms-marco-MiniLM-L6-v2. For the bge-reranker-v2-m3 comparison run set
    # RERANKER_MODEL=BAAI/bge-reranker-v2-m3, RERANKER_REVISION=953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e and
    # RERANKER_MEMORY=3G (ROADMAP §7). Official weights, pinned by revision, cached in a named volume.
    build: ./reranker
    image: bank-policy-rag-reranker:phase4
    profiles: [rerank]
    environment:
      RERANKER_MODEL: "${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}"
      RERANKER_REVISION: "${RERANKER_REVISION:-233902d25c440f23af6f7d6e94d2946bac0bee0a}"
      RERANKER_THREADS: "2"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: ${RERANKER_MEMORY:-1G}
    volumes:
      - reranker-models:/models
    ports:
      # No authentication: loopback only.
      - "127.0.0.1:18090:8080"

  # Optional local observability for people not using the shared stacks (ROADMAP §7, spec 05 §5.3).
  # Start with: docker compose --profile observability up -d
  # Point the app at this Jaeger with OTLP_ENDPOINT=http://127.0.0.1:4318/v1/traces and set
  # MANAGEMENT_ADDRESS=0.0.0.0 so the Prometheus container can reach host.docker.internal:8081.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  prometheus:
    # v3.13.1; same digest as the shared monitoring stack.
    image: prom/prometheus@sha256:2d61f37ba9f2185195dfad94ee500d7ac1986560bac79a77d0a6de182a5bf814
    profiles: [observability]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  es-data:
  ollama-models:
  reranker-models:

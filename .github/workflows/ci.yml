name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit and integration tests
        run: ./gradlew :core:test :app:test :eval-runner:test --max-workers=2

      - name: Example Bank retrieval gate
        run: ./gradlew :app:ciGate --max-workers=2

      - name: Every container has CPU and memory limits
        run: |
          command -v jq >/dev/null || { echo "jq is required by check-compose-limits.sh"; exit 1; }
          scripts/check-compose-limits.sh

      - name: No SPM PDF or HKMA URL in tracked files
        run: scripts/check-no-spm.sh

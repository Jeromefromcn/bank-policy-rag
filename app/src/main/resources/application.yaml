# Defaults; secrets and per-machine values come from environment variables (.env.example).
rag:
  env-prefix: ${RAG_ENV_PREFIX:rag_dev}
  security:
    api-keys:
      - key: ${RAG_KEY_DEV:}
        principal: dev
        clearance: restricted
        roles: []
  embedding:
    # Key into `models`; one model per process (RAG_EMBEDDING_MODEL=bge-small|bge-m3 for the ablation).
    model: ${RAG_EMBEDDING_MODEL:nomic}
    num-thread: 3
    batch-size: 16
    cache-dir: .cache/embeddings
    models:
      nomic:
        ollama-model: nomic-embed-text
        short-name: nomic
        dims: 768
        query-prefix: "search_query: "
        document-prefix: "search_document: "
      bge-small:
        # Community GGUF import (Q8_0); there is no official Ollama tag. See spec 02 §2.
        ollama-model: hf.co/CompendiumLabs/bge-small-en-v1.5-gguf:Q8_0
        short-name: bgesmall
        dims: 384
        query-prefix: "Represent this sentence for searching relevant passages: "
        document-prefix: ""
      bge-m3:
        ollama-model: bge-m3
        short-name: bgem3
        dims: 1024
        query-prefix: ""
        document-prefix: ""
  retrieval:
    num-candidates: 100
    leg-size: 50
    # Blank = the <prefix>-chunks / <prefix>-sections aliases. Set to read one physical index (ablation runs).
    chunks-index: ${RAG_CHUNKS_INDEX:}
    sections-index: ${RAG_SECTIONS_INDEX:}
  chunking:
    kind: fixed
    max-tokens: 512
    overlap-tokens: 64
    structural:
      max-tokens: 400
      min-tokens: 60
  corpus:
    root: corpus
  rerank:
    url: ${RERANKER_URL:http://127.0.0.1:18090}
    candidates: 20
    max-passage-tokens: 256
    timeout: 5s
  ask:
    # 0 = gate off. The value comes from decisions/03 (spec 03 §3.2).
    min-similarity: ${RAG_ASK_MIN_SIMILARITY:0.0}
    min-overlap: 0.5
    # Rerank-score gate, only with rerank: true. 0 = off until decisions/04 (spec 04 §5).
    min-rerank-probability: ${RAG_ASK_MIN_RERANK_PROBABILITY:0.0}
  conversation:
    ttl: 30m
    max-turns: 5
    max-conversations: 1000

spring:
  application:
    name: bank-policy-rag
  elasticsearch:
    uris: ${ES_URL:http://127.0.0.1:9200}
    username: ${rag.env-prefix}
    password: ${ES_PASSWORD:}
  http:
    clients:
      # Applies to Ollama and DeepSeek calls: a hung backend fails instead of hanging the request.
      connect-timeout: 5s
      read-timeout: 60s
  mvc:
    problemdetails:
      enabled: true
  ai:
    model:
      chat: deepseek
      embedding: ollama
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-flash
          temperature: 0.0
          max-tokens: 1024
    # Spring AI retries failed model calls; keep a hung or failing backend from holding a request for minutes.
    retry:
      max-attempts: 2
    ollama:
      base-url: ${OLLAMA_URL:http://127.0.0.1:11434}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # The app's ES user has no cluster privileges, so the default indicator would report DOWN.
    elasticsearch:
      enabled: false
